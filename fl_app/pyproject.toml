[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fedecg"
version = "0.1.0"
description = "PrivFedXAI: five-client FedAvg of ECGCNNAttn on PTB-XL"
license = {file = "LICENSE"}
dependencies = [
    "flwr[simulation]>=1.36.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"
fab-format-version = 1
flwr-version-target = "1.36.0"

[tool.flwr.app.components]
serverapp = "fedecg.server_app:app"
clientapp = "fedecg.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 30
fraction-evaluate = 0.0
local-epochs = 1
learning-rate = 0.001
batch-size = 64